<!DOCTYPE html>
<html>
<head>
    <title>Playwright Recorder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
            background-color: #f5f5f5;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }
        .title {
            margin: 0;
            color: #333;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            opacity: 1;
            transition: opacity 0.2s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #start-recording {
            background-color: #4CAF50;
            color: white;
        }
        #stop-recording {
            background-color: #f44336;
            color: white;
        }
        #clear-recording {
            background-color: #ff9800;
            color: white;
        }
        #export-script {
            background-color: #2196F3;
            color: white;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            background-color: #e8e8e8;
        }
        .recording-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ccc;
            display: inline-block;
        }
        .recording-indicator.active {
            background-color: #f44336;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        /* Enhanced scrollable actions container */
        #actions-container {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 250px; /* Fixed initial height */
            margin-bottom: 15px;
        }
        .actions-header {
            padding: 10px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        #recorded-actions {
            overflow-y: auto;
            flex-grow: 1;
            padding: 10px;
        }
        .action-item {
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
        }
        .action-item:nth-child(odd) {
            background-color: #f9f9f9;
        }
        .action-number {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: #2196F3;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .action-type {
            font-weight: bold;
            margin-right: 5px;
        }
        .action-details {
            color: #555;
            margin-left: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .action-value {
            color: #0066cc;
            font-style: italic;
        }
        /* Add a resizer for actions container */
        .actions-resizer {
            height: 8px;
            background-color: #f0f0f0;
            cursor: ns-resize;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            position: relative;
            text-align: center;
        }
        .actions-resizer::before {
            content: "⋯";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-size: 14px;
        }
        .language-selector {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
        }
        .language-selector label {
            margin-right: 10px;
            font-weight: bold;
        }
        #language-select {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: white;
            min-width: 150px;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .language-indicator {
            font-size: 14px;
            padding: 4px 8px;
            background-color: #eee;
            border-radius: 4px;
            color: #555;
        }
        .footer {
            margin-top: 15px;
            color: #666;
            font-size: 12px;
            text-align: center;
        }
        .empty-message {
            padding: 20px;
            color: #666;
            text-align: center;
        }
        .export-controls {
            margin-top: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
        }
        
        /* Enhanced script preview with better scrolling */
        .script-preview {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            height: 200px; /* Fixed height to ensure scrollability */
        }
        
        .script-preview-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden; /* Ensures content doesn't overflow */
            background-color: white;
        }
        
        #script-textarea {
            width: 100%;
            height: 100%; /* Fill the container */
            font-family: monospace;
            padding: 10px;
            resize: none; /* Disable manual resize */
            border: none; /* The container already has a border */
            overflow-y: auto; /* Enable vertical scrolling */
            box-sizing: border-box;
            background-color: white;
        }
        
        /* Add a resizer handle */
        .script-resizer {
            height: 8px;
            background-color: #f0f0f0;
            cursor: ns-resize;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            margin: 5px 0;
            position: relative;
            text-align: center;
        }
        
        /* Add a grip indicator to make the resizer more obvious */
        .script-resizer::before {
            content: "⋯";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="header">
    <h1 class="title">Playwright Recorder</h1>
    <div>v1.1</div>
</div>

<div class="controls">
    <button id="start-recording">Start Recording</button>
    <button id="stop-recording">Stop Recording</button>
    <button id="clear-recording">Clear Recording</button>
    <button id="export-script">Export Script</button>
</div>

<div class="status-bar">
    <div id="recording-indicator" class="recording-indicator"></div>
    <div id="status">Not recording</div>
</div>

<div class="language-selector">
    <label for="language-select">Output language:</label>
    <select id="language-select">
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <option value="csharp">C#</option>
    </select>
</div>

<div id="actions-container">
    <div class="actions-header">
        <span>Recorded Actions</span>
        <span id="actions-count">0 actions</span>
    </div>
    <div id="recorded-actions"></div>
</div>
<div class="actions-resizer" id="actions-resizer"></div>

<div class="script-preview">
    <div class="preview-header">
        <h3>Script Preview</h3>
        <div id="language-indicator" class="language-indicator">JavaScript</div>
    </div>
    <div class="script-preview-container">
        <textarea id="script-textarea" readonly></textarea>
    </div>
    <div class="script-resizer" id="script-resizer"></div>
</div>

<div class="footer">
    <p>Click "Start Recording" and interact with your web page. Your actions will be recorded and converted to code in your selected language.</p>
</div>

<script src="recorder.js"></script>
</body>
</html>
